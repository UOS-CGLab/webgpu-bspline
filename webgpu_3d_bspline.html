<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cube rotation</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #222;
        color: #eee;
      }
      #controls {
        margin: 10px;
        padding: 10px 15px;
        border: 1px solid #555;
        border-radius: 8px;
        background-color: #333;
        display: flex;
        gap: 20px;
        align-items: center;
      }
      label {
        margin-right: 5px;
        cursor: pointer;
      }
      .control-group {
        display: flex;
        align-items: center;
      }
      #selection-info {
        margin-top: 5px;
        padding: 8px;
        background-color: #2a2a2a;
        border-radius: 4px;
        min-height: 20px;
        text-align: center;
        font-family: "JetBrains Mono", Consolas, Courier, monospace;
      }
      .invisible {
        display: none;
      }
      select {
        background-color: #444;
        color: #eee;
        border: 1px solid #666;
        border-radius: 4px;
        padding: 2px 4px;
      }
    </style>
  </head>
  <body>
    <!-- 렌더링 제어용 체크박스 UI 추가 -->
    <!-- UI 컨트롤 그룹 -->
    <div id="controls">
      <div class="control-group">
        <input type="checkbox" id="show-cubes" name="visibility" checked />
        <label for="show-cubes">Cubes</label>

        <input type="checkbox" id="show-lines" name="visibility" checked />
        <label for="show-lines">Lines</label>

        <input type="checkbox" id="show-model" name="visibility" checked />
        <label for="show-model">Model</label>

        <input type="checkbox" id="show-debug" name="visibility" />
        <label for="show-debug">Debug</label>
      </div>
      <div class="control-group">
        <label for="opacity-slider">Unselected Opacity:</label>
        <input
          type="range"
          id="opacity-slider"
          min="0"
          max="1"
          value="0.1"
          step="0.05"
        />
      </div>
      <div class="control-group">
        <label for="cube-selector">Select Cube:</label>
        <select id="cube-selector"></select>
      </div>
    </div>

    <!-- 선택된 큐브 정보 표시 -->
    <div id="selection-info">Selected Cube Index: None</div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <canvas id="picking" width="800" height="600" class="invisible"></canvas>

    <script type="module" src="./src/3D-bspline/main.ts"></script>
  </body>
</html>
